# mold cuts link time noticeably here: the workspace links a bin, a bench, a lib
# test binary and ten integration test binaries against skim/ratatui/tokio/axum.
# Requires mold on PATH (https://github.com/rui314/mold).
[build]
rustflags = ["-Clink-arg=-fuse-ld=mold"]

# Intentionally left out of the line above: it pins the build to this machine's
# CPU and lowers sccache hit rates.
#   "-Ctarget-cpu=native"
