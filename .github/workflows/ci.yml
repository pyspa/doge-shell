# doge-shell supports Linux and macOS, and a macOS host is the only thing that
# can prove the `#[cfg(target_os = "macos")]` arms even compile: `cargo check`
# only ever sees the host's arm, and cross-compiling to Darwin from Linux is out
# (rusqlite bundles SQLite and mac-notification-sys builds Objective-C, so both
# want the Apple SDK). That is what the macos-latest leg of the matrix is for.
#
# See docs/ai/skills/doge-shell-repo/references/platform-support.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI-only failure is usually the whole investigation.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Never let one platform's failure hide the other's; which of the two
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      # .cargo/config.toml points the Linux linker at mold unconditionally, so
      # without this every link on this leg fails with "cannot find -fuse-ld=mold".
      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # dsh/tests/ launch the shell as a child process, and a test binary
      # inherits fd 0. There is no tty on a runner, but closing it keeps the
      # suite honest about never reading one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pinned agent sandbox
        run: npm install --global --ignore-scripts @anthropic-ai/sandbox-runtime@0.0.75

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y bubblewrap socat

      - name: Agent OS sandbox boundary
        run: cargo test -p dsh-builtin --lib agent::sandbox::tests::real_sandbox -- --ignored

      - name: Test
        run: cargo test --workspace < /dev/null

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: AI guidance
        run: scripts/check-ai-guidance.sh

      - name: Project consistency
        run: scripts/check-project-consistency.py

      - name: ShellProxy capability coverage
        run: scripts/check-shell-proxy-capabilities.py

      - name: Portability
        run: scripts/check-portability.py

  msrv:
    name: msrv (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@3920daf79df8fb8df1dbef6e64563e2901a73745 # 1.91

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.91

      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - name: Check workspace with MSRV
        run: cargo check --workspace --all-targets
