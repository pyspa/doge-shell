# doge-shell supports Linux and macOS, and a macOS host is the only thing that
# can prove the `#[cfg(target_os = "macos")]` arms even compile: `cargo check`
# only ever sees the host's arm, and cross-compiling to Darwin from Linux is out
# (rusqlite bundles SQLite and mac-notification-sys builds Objective-C, so both
# want the Apple SDK). That is what the macos-latest leg of the matrix is for.
#
# See docs/ai/skills/doge-shell-repo/references/platform-support.md.
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI-only failure is usually the whole investigation.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Never let one platform's failure hide the other's; which of the two
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      # .cargo/config.toml points the Linux linker at mold unconditionally,
      # so without this every link on this leg fails with
      # "cannot find -fuse-ld=mold".
      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # dsh/tests/ launch the shell as a child process, and a test binary
      # inherits fd 0. There is no tty on a runner, but closing it keeps the
      # suite honest about never reading one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pinned agent sandbox
        run: >
          npm install --global --ignore-scripts
          @anthropic-ai/sandbox-runtime@0.0.75

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        # bubblewrap/socat drive the OS sandbox; ripgrep is required by the
        # pinned sandbox runtime (it fails startup with "ripgrep (rg) not
        # found" without it).
        run: >
          sudo apt-get install --no-install-recommends -y
          bubblewrap socat ripgrep

      - name: Agent OS sandbox boundary
        run: >
          cargo test -p dsh-builtin --lib
          agent::sandbox::tests::real_sandbox -- --ignored

      # Fail fast on a runaway suite: a healthy workspace run takes a few
      # minutes, so hitting this 15-minute step timeout means a regression,
      # not a slow day.
      - name: Test
        timeout-minutes: 15
        run: cargo test --workspace < /dev/null

      - name: Agent eval fixture contract
        run: |
          python3 scripts/check-agent-eval-schemas.py
          python3 scripts/check-agent-eval-fixtures.py
          python3 scripts/eval-agent-routing.py
          scripts/check-ai-guidance.sh
          python3 scripts/check-agent-context-budget.py

  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Never let one platform's failure hide the other's; which of the two
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: contract-${{ matrix.os }}

      # .cargo/config.toml points the Linux linker at mold unconditionally,
      # so without this every link on this leg fails with
      # "cannot find -fuse-ld=mold".
      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - name: Shell execution contract
        timeout-minutes: 15
        run: cargo test -p doge-shell --test shell_contract < /dev/null

      - name: Resource ownership contract
        timeout-minutes: 15
        run: cargo test -p doge-shell --test resource_contract < /dev/null

      - name: Lifecycle property
        timeout-minutes: 10
        run: cargo test -p doge-shell --lib lifecycle_property < /dev/null

      - name: Execution boundary regressions
        timeout-minutes: 15
        run: >
          cargo test -p doge-shell --test fd_ownership
          --test reexec_subshell --test substitution --test pipeline_semantics
          --test background_builtin --test wait_semantics
          --test async_exit_semantics --test harness_contract < /dev/null

  stress-fast:
    name: stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-fast-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      # Fast lifecycle/race lane only (see .config/nextest.toml):
      # retries diagnose flakes, `flaky-result = "fail"` keeps them red, and
      # an empty selection fails instead of going green. Serial (`-j 1`):
      # races are created explicitly inside tests, never by the runner.
      # The two internally repeated resource/leak tests are excluded here
      # (binary-scoped so only those two move) and run in the resource jobs
      # below (`stress-resource-fd` / `stress-resource-repeated`), so the
      # outer `--stress-count 9` does not multiply their in-test iterations.
      # `contract_background` stays in this lane at the
      # full outer count. Outer 9, not 10: the split lane still timed out
      # the 30-minute step at iteration 10, test 278/296 on macOS (push run
      # 36377022565). 10 to 9 is an explicit 10% reduction in outer samples,
      # exchanged for budget margin without raising the timeout; it does
      # not claim equivalent race detection.
      - name: Fast lifecycle/race stress
        timeout-minutes: 30
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 9
          -E '(binary(shell_contract) or binary(resource_contract)
          or binary(fd_ownership) or binary(reexec_subshell)
          or binary(substitution)
          or binary(pipeline_semantics) or binary(background_builtin)
          or binary(wait_semantics) or binary(async_exit_semantics)
          or binary(harness_contract)
          or test(lifecycle_property) or test(/output_monitor_(running|completion)/)
          or test(foreground_output_observer)
          or test(/process_substitution::tests::/))
          and not ((binary(resource_contract)
          and test(process_substitution_does_not_exhaust_fd_budget))
          or (binary(reexec_subshell)
          and test(repeated_process_substitution_does_not_hang_or_leak)))'
          < /dev/null

  stress-resource-fd:
    name: stress-resource-fd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-resource-fd-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      # FD-budget lane (independent job/runner with its own 25-minute job
      # budget and 15-minute step budget): the test chains 128
      # substitutions under a tight NOFILE limit (a self-contained
      # contract), so the outer count stays at 3. Serial (`-j 1`) with the
      # same retries/`flaky-result = "fail"`/`leak-timeout` policy as the
      # fast lane. A timeout or failure here cannot skip or starve the
      # repeated-substitution lane, which runs as its own job below.
      - name: Resource/leak stress (FD budget)
        timeout-minutes: 15
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 3
          -E 'binary(resource_contract)
          and test(process_substitution_does_not_exhaust_fd_budget)'
          < /dev/null

  stress-resource-repeated:
    name: stress-resource-repeated (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-resource-repeated-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      # Repeated-substitution lane (independent job/runner with its own
      # 25-minute job budget and 15-minute step budget): the test runs 20
      # shells per invocation, so 5 outer repeats give 100 aggregate shells
      # (down from the former 200, up from a minimal 60) without
      # multiplying the same loop 10x. Serial (`-j 1`) with the same
      # retries/`flaky-result = "fail"`/`leak-timeout` policy as the fast
      # lane. A timeout or failure here cannot skip or starve the FD-budget
      # lane, which runs as its own job above.
      - name: Resource/leak stress (repeated substitution)
        timeout-minutes: 15
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 5
          -E 'binary(reexec_subshell)
          and test(repeated_process_substitution_does_not_hang_or_leak)'
          < /dev/null

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: AI guidance
        run: scripts/check-ai-guidance.sh

      - name: Project consistency
        run: scripts/check-project-consistency.py

      - name: ShellProxy capability coverage
        run: scripts/check-shell-proxy-capabilities.py

      - name: Portability
        run: scripts/check-portability.py

      - name: Runtime authority
        run: scripts/check-runtime-authority.py

      - name: Execution authority
        run: scripts/check-execution-authority.py

      - name: File budget
        run: scripts/check-file-budget.py

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.95

      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - name: Check workspace with MSRV
        run: cargo check --workspace --all-targets
