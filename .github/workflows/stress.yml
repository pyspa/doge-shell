# Stress lanes live here so PR CI stays fast and deterministic.
#
# - develop push runs only the lightweight Ubuntu lane (--stress-count 2):
#   cheap re-check of race/lifecycle regressions right after integration.
# - nightly/manual run the full statistical lanes on Ubuntu + macOS
#   (fast x10, FD-budget x3, repeated substitution x5).
# - The two heavy resource tests stay out of the fast lane so the outer
#   --stress-count does not multiply their in-test iterations.
# - macOS coverage matters only for nightly sampling, not PR feedback.
name: Stress

permissions:
  contents: read

on:
  push:
    branches:
      - develop

  schedule:
    # 03:17 JST (18:17 UTC previous day). Cron is UTC-only; 00:00 UTC is
    # avoided because scheduled load concentrates there.
    - cron: "17 18 * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stress-develop:
    name: stress-develop (ubuntu-latest)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-develop-ubuntu

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      # Lightweight develop lane: same selection as the full fast lane but
      # --stress-count 2. Not statistical sampling; nightly owns that.
      - name: Lightweight lifecycle/race stress
        timeout-minutes: 10
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 2
          -E '(binary(shell_contract) or binary(resource_contract)
          or binary(fd_ownership) or binary(reexec_subshell)
          or binary(substitution)
          or binary(pipeline_semantics) or binary(background_builtin)
          or binary(wait_semantics) or binary(async_exit_semantics)
          or binary(harness_contract)
          or test(lifecycle_property) or test(/output_monitor_(running|completion)/)
          or test(foreground_output_observer)
          or test(/process_substitution::tests::/))
          and not ((binary(resource_contract)
          and test(process_substitution_does_not_exhaust_fd_budget))
          or (binary(reexec_subshell)
          and test(repeated_process_substitution_does_not_hang_or_leak)))'
          < /dev/null

  stress-full:
    name: stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Scheduled definitions run from the default branch, but the subject
      # under test is always develop.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-full-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      # Full fast lifecycle/race lane: serial (`-j 1`), races are created
      # explicitly inside tests, never by the runner.
      - name: Fast lifecycle/race stress
        timeout-minutes: 35
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 10
          -E '(binary(shell_contract) or binary(resource_contract)
          or binary(fd_ownership) or binary(reexec_subshell)
          or binary(substitution)
          or binary(pipeline_semantics) or binary(background_builtin)
          or binary(wait_semantics) or binary(async_exit_semantics)
          or binary(harness_contract)
          or test(lifecycle_property) or test(/output_monitor_(running|completion)/)
          or test(foreground_output_observer)
          or test(/process_substitution::tests::/))
          and not ((binary(resource_contract)
          and test(process_substitution_does_not_exhaust_fd_budget))
          or (binary(reexec_subshell)
          and test(repeated_process_substitution_does_not_hang_or_leak)))'
          < /dev/null

  stress-resource-fd:
    name: stress-resource-fd (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-resource-fd-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      - name: Resource/leak stress (FD budget)
        timeout-minutes: 15
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 3
          -E 'binary(resource_contract)
          and test(process_substitution_does_not_exhaust_fd_budget)'
          < /dev/null

  stress-resource-repeated:
    name: stress-resource-repeated (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop

      # stable toolchain
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stress-resource-repeated-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      # Pinned cargo-nextest 0.9.145 (supports retries, flaky-result=fail,
      # slow-timeout, leak-timeout, --stress-count). The installer itself is
      # pinned by commit SHA like every other action in this file
      # (install-action 2.87.16 at pin time).
      - name: Install cargo-nextest
        # install-action 2.87.16 at pin time
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: nextest@0.9.145

      - name: Resource/leak stress (repeated substitution)
        timeout-minutes: 15
        run: >
          cargo nextest run -p doge-shell -P ci -j 1 --stress-count 5
          -E 'binary(reexec_subshell)
          and test(repeated_process_substitution_does_not_hang_or_leak)'
          < /dev/null
