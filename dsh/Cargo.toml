[package]
name = "doge-shell"
description = "The simple shell"
authors = ["mopemope <yutaka.matsubara@gmail.com>"]
edition = "2024"
rust-version.workspace = true
license.workspace = true
version = "0.0.1"

[[bin]]
path = "src/main.rs"
name = "dsh"

[[bench]]
name = "latency"
harness = false

[features]
default = ["i64", "f64"]
bigint = ["num-bigint"]
i128 = []
i64 = []
i32 = []
i16 = []
i8 = []
f64 = []
f32 = []


[dependencies]
dsh-types = { path = "../dsh-types" }
dsh-frecency = { path = "../dsh-frecency" }
dsh-builtin = { path = "../dsh-builtin" }
dsh-openai = { path = "../dsh-openai" }

anyhow = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cfg-if = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console = { workspace = true }
crossterm = { workspace = true }
xdg = { workspace = true }
shellexpand = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
xid = { workspace = true }
parking_lot = { workspace = true }
skim = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
ratatui = { workspace = true }
unicode-width = "0.2"
async-trait = "0.1"
arboard = "3.4"

clap = { version="4", features = ["derive"] }
globmatch = "0.3"
regex = "1.11"
shell-words = "1.1"
pulldown-cmark = "0.13"
csv = "1.3"

chrono = "0.4"
term_size = "0.3"
termion = "4"
termios = "0.3"
notify-rust = "4"
file-lock = "2"
notify = { version = "8", features = ["serde"] }
easy_reader = "0.5"
pest = "2.8"
pest_derive = "2.8"
fuzzy-matcher = "0.3"
indexmap = { version = "2", features = ["serde"] }
tabled = { version = "0.21", default-features = false, features = ["std"] }
num-bigint = { version = "0.5", optional = true }
num-traits = "0.2"
rust-embed = "8.5"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.0"
which = "8.0"
wait-timeout = "0.2"
glob = "0.3"
toml = "1"


# macOS has neither /proc nor /sys, so the process and network-interface
# completion generators need other sources there: sysinfo for the process list
# (dsh-builtin already builds it) and nix's getifaddrs binding, which the `net`
# feature gates, for the interfaces. Both are scoped to macOS so no other
# target pays for them.
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { workspace = true }
nix = { workspace = true, features = ["net"] }

[dev-dependencies]
