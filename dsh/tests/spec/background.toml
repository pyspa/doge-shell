version = 1

# Background execution: an async launch reports status 0 at once, the next
# list starts without waiting, and helper stdout/stderr follow ordinary fd
# inheritance. The shell process itself never waits for background
# completion at exit (see the dedicated `async_exit_semantics` integration
# test for the process-level proof: this pipe-capturing harness holds EOF
# until inherited write ends close, so it cannot observe prompt exit).

[[case]]
id = "background.external-returns-zero-promptly"
class = "posix"
mode = "command"
script = "{{TRUE}} & echo BG:$?"

[case.expect]
status = 0
stdout_contains = ["BG:0"]

[[case]]
id = "background.async-output-inherits-stdout"
class = "posix"
mode = "command"
script = "echo bg-marker & echo ALL:$?"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["bg-marker", "ALL:0"]

# `&` backgrounds the whole AND-OR list: the pipeline runs asynchronously
# and the next list starts without waiting for it.
[[case]]
id = "background.pipeline-in-background"
class = "posix"
mode = "command"
script = "echo hi | {{TR}} a-z A-Z & echo BG:$?"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["BG:0"]

# The parent-visible status of an async launch is 0 even when the
# background body itself fails.
[[case]]
id = "background.async-parent-status"
class = "posix"
mode = "command"
script = "{{FALSE}} & echo BG:$?"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["BG:0"]

# `a && b &` backgrounds the whole AND chain; output order is scheduler
# dependent, so only presence is asserted.
[[case]]
id = "background.and-list-whole-background"
class = "posix"
mode = "command"
script = "{{TRUE}} && echo INNER & echo OUTER"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["INNER", "OUTER"]

# Gating happens inside the helper: the skipped branch never runs.
[[case]]
id = "background.and-list-skip"
class = "posix"
mode = "command"
script = "{{FALSE}} && echo SHOULD_NOT_RUN & echo AFTER"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["AFTER"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "background.or-list"
class = "posix"
mode = "command"
script = "{{FALSE}} || echo RECOVERED & echo AFTER"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["RECOVERED", "AFTER"]

# `false || echo A && echo B & echo C`: the async body is the whole
# `false || echo A && echo B`, `echo C` is the next foreground list.
[[case]]
id = "background.mixed-and-or-list"
class = "posix"
mode = "command"
script = "{{FALSE}} || echo A && echo B & echo C"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["A", "B", "C"]

# State isolation: mutations persist across the list inside the helper but
# never leak into the parent.
[[case]]
id = "background.state-isolation"
class = "posix"
mode = "command"
script = "ASYNC_SCOPE=parent; ASYNC_SCOPE=child && echo INNER:$ASYNC_SCOPE & echo OUTER:$ASYNC_SCOPE"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["INNER:child", "OUTER:parent"]

# `cd` runs in the helper itself, so the rest of the async list sees it
# while the parent cwd is unchanged.
[[case]]
id = "background.cd-stays-in-helper"
class = "posix"
mode = "command"
script = "cd /tmp && pwd & echo AFTER"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["AFTER", "tmp"]

# The next list starts before background completion: when the foreground
# check runs, the marker file does not exist yet. The helper writes it on
# its own afterwards, independent of the parent shell's exit.
[[case]]
id = "background.next-command-does-not-wait"
class = "posix"
mode = "command"
script = "rm -f marker; sleep 1 && echo done > marker & test ! -e marker && echo EARLY"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["EARLY"]

[[case.expect.files]]
path = "marker"
exists = true
content_contains = ["done"]

# An explicit `< file` redirection inside the list overrides the async
# `/dev/null` stdin default.
[[case]]
id = "background.explicit-input-redirect"
class = "posix"
mode = "command"
script = "echo hello > input; cat < input & echo NEXT"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["hello", "NEXT"]

# A selected session-bound builtin fails closed inside the helper without
# aborting the parent line. Non-interactive helpers inherit the caller fds
# directly (no capture monitor), so the helper diagnostic lands on stderr.
[[case]]
id = "background.session-bound-builtin"
class = "dogesh"
mode = "command"
script = "jobs & echo AFTER"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["AFTER"]
stderr_contains = ["cannot run in background"]

# A short-lived pipeline in the background must not hang the shell.
[[case]]
id = "background.pipeline-lifecycle"
class = "posix"
mode = "command"
script = "{{YES}} | {{HEAD}} -n 1 & echo NEXT"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["NEXT"]

# Large background pipe output must flow without deadlock.
[[case]]
id = "background.large-output-no-deadlock"
class = "posix"
mode = "command"
script = "{{YES}} | {{HEAD}} -c 131072 > bg.txt & echo NEXT"
timeout_ms = 15000

[case.expect]
status = 0
stdout_contains = ["NEXT"]

[[case.expect.files]]
path = "bg.txt"
exists = true

# `fg` is status-bearing: the foregrounded command status passes through.
[[case]]
id = "background.fg-propagates-command-status"
class = "dogesh"
mode = "command"
script = "{{FALSE}} & fg %1; echo FG:$?"

[case.expect]
status = 0
stdout_contains = ["FG:1"]

# `fg` with an empty job table is an error, never success.
[[case]]
id = "background.fg-without-current-job-is-error"
class = "dogesh"
mode = "command"
script = "fg; echo FG:$?"

[case.expect]
status = 0
stdout_contains = ["FG:1"]
stderr_contains = ["fg:"]

# Completed foreground pipeline uses the launch-time frozen policy.
[[case]]
id = "background.fg-pipefail-off-uses-tail-status"
class = "dogesh"
mode = "command"
script = "{{FALSE}} | {{TRUE}} & fg %1; echo FG:$?"

[case.expect]
status = 0
stdout_contains = ["FG:0"]

[[case]]
id = "background.fg-pipefail-on-uses-logical-status"
class = "dogesh"
mode = "command"
script = "set -o pipefail; {{FALSE}} | {{TRUE}} & fg %1; echo FG:$?"

[case.expect]
status = 0
stdout_contains = ["FG:1"]

# `bg` with no stopped job is an error, never success.
[[case]]
id = "background.bg-without-stopped-job-is-error"
class = "dogesh"
mode = "command"
script = "bg; echo BG:$?"

[case.expect]
status = 0
stdout_contains = ["BG:1"]
stderr_contains = ["bg:"]

# `jobs` rejects unknown options instead of silently ignoring argv.
[[case]]
id = "background.jobs-invalid-option-is-error"
class = "dogesh"
mode = "command"
script = "jobs --definitely-invalid; echo JOBS:$?"

[case.expect]
status = 0
stdout_contains = ["JOBS:1"]
stderr_contains = ["jobs:"]
