version = 1

# External command search: slash bypass, executable candidate priority,
# and command-scoped PATH overrides.

[[case]]
id = "command-search.slash-bypasses-path"
class = "posix"
mode = "command"
script = "mkdir -p sub; printf '#!/bin/sh\\necho PROBE-RUNS\\n' > sub/probe; chmod +x sub/probe; PATH=/definitely/not/a/real/path; sub/probe"

[case.expect]
status = 0
stdout_contains = ["PROBE-RUNS"]

[[case]]
id = "command-search.skips-non-executable-candidate"
class = "posix"
mode = "command"
script = "mkdir -p pa pb; printf '#!/bin/sh\\necho MARKER-A\\n' > pa/foo; chmod 644 pa/foo; printf '#!/bin/sh\\necho MARKER-B\\n' > pb/foo; chmod +x pb/foo; PATH=pa:pb:$PATH; foo"

[case.expect]
status = 0
stdout_contains = ["MARKER-B"]

[[case]]
id = "command-search.command-scoped-path"
class = "posix"
mode = "command"
script = "mkdir -p pa pb; printf '#!/bin/sh\\necho MARKER-A\\n' > pa/foo; chmod +x pa/foo; printf '#!/bin/sh\\necho MARKER-B\\n' > pb/foo; chmod +x pb/foo; PATH=pa:$PATH; PATH=pb foo; foo"

[case.expect]
status = 0
stdout_contains = ["MARKER-B", "MARKER-A"]

[[case]]
id = "command-search.resolved-permission-denied"
class = "posix"
mode = "command"
script = "printf blocked > denied; chmod 644 denied; ./denied; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.resolved-missing-interpreter"
class = "posix"
mode = "command"
script = "printf '#!/doge-shell-no-such-interpreter-xyz\\n' > broken; chmod +x broken; ./broken; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.permission-status-pipeline-tail"
class = "posix"
mode = "command"
script = "printf blocked > denied; chmod 644 denied; echo upstream | ./denied; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.permission-status-background-helper"
class = "posix"
mode = "command"
script = "printf blocked > denied; chmod 644 denied; ./denied & wait $!; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.permission-status-command-substitution"
class = "posix"
mode = "command"
script = "printf blocked > denied; chmod 644 denied; x=$(./denied); echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.missing-path-stays-127"
class = "posix"
mode = "command"
script = "./doge-shell-no-such-program-xyz; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:127"]
stderr_contains = ["command not found"]

[[case]]
id = "command-search.redirect-failure-stays-1"
class = "posix"
mode = "command"
script = "{{TRUE}} > missing-dir/output; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:1"]
stderr_contains = ["failed to create redirect file"]

[[case]]
id = "command-search.permission-status-pipefail-head"
class = "posix"
mode = "command"
script = "printf blocked > denied; chmod 644 denied; set -o pipefail; ./denied | {{TRUE}}; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]

[[case]]
id = "command-search.path-permission-denied"
class = "posix"
mode = "command"
script = "mkdir -p pa pb; printf blocked > pa/doge-path-denied-xyz; chmod 644 pa/doge-path-denied-xyz; PATH=pa:pb:$PATH; doge-path-denied-xyz; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.scoped-path-permission-denied"
class = "posix"
mode = "command"
script = "mkdir -p pa; printf blocked > pa/doge-path-denied-xyz; chmod 644 pa/doge-path-denied-xyz; PATH=pa doge-path-denied-xyz; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.relative-path-permission-refresh"
class = "posix"
mode = "command"
script = "mkdir -p a/bin b/bin; printf blocked > a/bin/doge-path-denied-xyz; chmod 644 a/bin/doge-path-denied-xyz; printf '#!/bin/sh\\necho MARKER-B\\n' > b/bin/doge-path-denied-xyz; chmod +x b/bin/doge-path-denied-xyz; PATH=bin:$PATH; cd a; doge-path-denied-xyz; echo FIRST:$?; cd ../b; doge-path-denied-xyz; echo SECOND:$?"

[case.expect]
status = 0
stdout_contains = ["FIRST:126", "MARKER-B", "SECOND:0"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.empty-path-permission-denied"
class = "posix"
mode = "command"
script = "printf blocked > doge-path-denied-xyz; chmod 644 doge-path-denied-xyz; PATH=:$PATH; doge-path-denied-xyz; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.path-permission-background"
class = "posix"
mode = "command"
script = "mkdir pa; printf blocked > pa/doge-path-denied-xyz; chmod 644 pa/doge-path-denied-xyz; PATH=pa:$PATH; doge-path-denied-xyz & wait $!; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.path-permission-command-substitution"
class = "posix"
mode = "command"
script = "mkdir pa; printf blocked > pa/doge-path-denied-xyz; chmod 644 pa/doge-path-denied-xyz; PATH=pa:$PATH; x=$(doge-path-denied-xyz); echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.path-permission-pipefail"
class = "posix"
mode = "command"
script = "mkdir pa; printf blocked > pa/doge-path-denied-xyz; chmod 644 pa/doge-path-denied-xyz; PATH=pa:$PATH; set -o pipefail; doge-path-denied-xyz | {{TRUE}}; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:126"]
stderr_contains = ["Permission denied"]

[[case]]
id = "command-search.denied-path-preserves-auto-cd"
class = "dogesh"
mode = "command"
script = "mkdir -p pa doge-path-dir-xyz; printf blocked > pa/doge-path-dir-xyz; chmod 644 pa/doge-path-dir-xyz; PATH=pa:$PATH; doge-path-dir-xyz; pwd"

[case.expect]
status = 0
stdout_contains = ["/doge-path-dir-xyz"]

[[case]]
id = "command-search.denied-path-preserves-builtin"
class = "dogesh"
mode = "command"
script = "mkdir -p pa builtin-target; printf blocked > pa/cd; chmod 644 pa/cd; PATH=pa:$PATH; cd builtin-target; pwd"

[case.expect]
status = 0
stdout_contains = ["/builtin-target"]
