version = 1

# Variable and tilde-adjacent word expansion (runtime PlannedWord path).

[[case]]
id = "expansion.simple-variable"
class = "posix"
mode = "command"
script = "FOO=bar; echo $FOO"

[case.expect]
status = 0
stdout_contains = ["bar"]

[[case]]
id = "expansion.braced-variable"
class = "posix"
mode = "command"
script = "FOO=bar; echo ${FOO}"

[case.expect]
status = 0
stdout_contains = ["bar"]

[[case]]
id = "expansion.variable-inside-double-quotes"
class = "posix"
mode = "command"
script = "FOO=bar; echo \"VAL:$FOO\""

[case.expect]
status = 0
stdout_contains = ["VAL:bar"]

[[case]]
id = "expansion.adjacent-text"
class = "posix"
mode = "command"
script = "FOO=bar; echo x$FOO"

[case.expect]
status = 0
stdout_contains = ["xbar"]

[[case]]
id = "expansion.single-quotes-suppress"
class = "posix"
mode = "command"
script = "FOO=bar; echo '$FOO'"

[case.expect]
status = 0
stdout_contains = ["$FOO"]
stdout_not_contains = ["bar"]

[[case]]
id = "expansion.unquoted-variable-splits"
class = "posix"
mode = "command"
script = "CMD='echo hello'; $CMD"

[case.expect]
status = 0
stdout_contains = ["hello"]

[[case]]
id = "expansion.custom-ifs-splits"
class = "posix"
mode = "command"
script = "IFS=:; CMD='echo:hello'; $CMD"

[case.expect]
status = 0
stdout_contains = ["hello"]

[[case]]
id = "expansion.quoted-variable-stays-one-field"
class = "posix"
mode = "command"
script = "X='a b'; printf '[%s]\\n' \"$X\""

[case.expect]
status = 0
stdout_contains = ["[a b]"]

[[case]]
id = "expansion.unset-variable-is-empty"
class = "posix"
mode = "command"
script = "echo $DOGESH_UNSET_PROBE_XYZ"

[case.expect]
status = 0
stdout_not_contains = ["$DOGESH_UNSET_PROBE_XYZ", "DOGESH_UNSET_PROBE_XYZ"]

[[case]]
id = "expansion.parameter-default-colon"
class = "posix"
mode = "command"
script = "echo ${DOGESH_PARAM_UNSET_DEFAULT:-fallback}"

[case.expect]
status = 0
stdout_contains = ["fallback"]

[[case]]
id = "expansion.parameter-default-colon-empty"
class = "posix"
mode = "command"
script = "X=; echo ${X:-fallback}"

[case.expect]
status = 0
stdout_contains = ["fallback"]

[[case]]
id = "expansion.parameter-default-colon-set"
class = "posix"
mode = "command"
script = "X=value; echo ${X:-fallback}"

[case.expect]
status = 0
stdout_contains = ["value"]
stdout_not_contains = ["fallback"]

[[case]]
id = "expansion.parameter-default-unset-only"
class = "posix"
mode = "command"
script = "echo ${DOGESH_PARAM_UNSET_DEFAULT2-fallback}"

[case.expect]
status = 0
stdout_contains = ["fallback"]

[[case]]
id = "expansion.parameter-default-unset-only-empty"
class = "posix"
mode = "command"
script = "X=; printf '[%s]\\n' \"${X-fallback}\""

[case.expect]
status = 0
stdout_contains = ["[]"]
stdout_not_contains = ["fallback"]

[[case]]
id = "expansion.parameter-default-unset-only-set"
class = "posix"
mode = "command"
script = "X=value; echo ${X-fallback}"

[case.expect]
status = 0
stdout_contains = ["value"]
stdout_not_contains = ["fallback"]

[[case]]
id = "expansion.parameter-assign-colon"
class = "posix"
mode = "command"
script = "echo ${DOGESH_PARAM_ASSIGN_COLON:=assigned}; echo $DOGESH_PARAM_ASSIGN_COLON"

[case.expect]
status = 0
stdout_contains = ["assigned"]

[[case]]
id = "expansion.parameter-assign-colon-empty"
class = "posix"
mode = "command"
script = "X=; echo ${X:=assigned}; echo $X"

[case.expect]
status = 0
stdout_contains = ["assigned"]

[[case]]
id = "expansion.parameter-assign-unset-only"
class = "posix"
mode = "command"
script = "X=; printf '[%s]\\n' \"${X=value}\"; printf '[%s]\\n' \"$X\""

[case.expect]
status = 0
stdout_contains = ["[]"]
stdout_not_contains = ["value"]

[[case]]
id = "expansion.parameter-assign-unset-only-unset"
class = "posix"
mode = "command"
script = "echo ${DOGESH_PARAM_ASSIGN_UNSET:=assigned}; echo $DOGESH_PARAM_ASSIGN_UNSET"

[case.expect]
status = 0
stdout_contains = ["assigned"]

[[case]]
id = "expansion.parameter-error-colon"
class = "posix"
mode = "command"
script = "X=; echo ${X:?boom}; echo SHOULD_NOT_RUN"

[case.expect]
status = 1
stderr_contains = ["X", "boom"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "expansion.parameter-error-unset-only"
class = "posix"
mode = "command"
script = "X=; printf '[%s]\\n' \"${X?boom}\""

[case.expect]
status = 0
stdout_contains = ["[]"]

[[case]]
id = "expansion.parameter-error-unset-only-unset"
class = "posix"
mode = "command"
script = "echo ${DOGESH_PARAM_ERR_UNSET?boom}; echo SHOULD_NOT_RUN"

[case.expect]
status = 1
stderr_contains = ["DOGESH_PARAM_ERR_UNSET", "boom"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "expansion.parameter-alternate-colon"
class = "posix"
mode = "command"
script = "X=value; echo ${X:+alternative}"

[case.expect]
status = 0
stdout_contains = ["alternative"]

[[case]]
id = "expansion.parameter-alternate-colon-empty"
class = "posix"
mode = "command"
script = "X=; printf '[%s]\\n' before ${X:+value} after"

[case.expect]
status = 0
stdout_contains = ["[before]", "[after]"]
stdout_not_contains = ["[value]"]

[[case]]
id = "expansion.parameter-alternate-set-only"
class = "posix"
mode = "command"
script = "X=; echo ${X+alternative}"

[case.expect]
status = 0
stdout_contains = ["alternative"]

[[case]]
id = "expansion.parameter-alternate-set-only-unset"
class = "posix"
mode = "command"
script = "printf '[%s]\\n' before ${DOGESH_PARAM_ALT_UNSET+value} after"

[case.expect]
status = 0
stdout_contains = ["[before]", "[after]"]
stdout_not_contains = ["[value]"]

[[case]]
id = "expansion.arithmetic-basic"
class = "posix"
mode = "command"
script = "echo $((1 + 2 * 3))"

[case.expect]
status = 0
stdout_contains = ["7"]

[[case]]
id = "expansion.arithmetic-precedence-parens"
class = "posix"
mode = "command"
script = "echo $(((1 + 2) * 3))"

[case.expect]
status = 0
stdout_contains = ["9"]

[[case]]
id = "expansion.arithmetic-variable"
class = "posix"
mode = "command"
script = "X=7; echo $((X + 1))"

[case.expect]
status = 0
stdout_contains = ["8"]

[[case]]
id = "expansion.arithmetic-parameter-operand"
class = "posix"
mode = "command"
script = "X=2; echo $(( ${X:-1} + 3 ))"

[case.expect]
status = 0
stdout_contains = ["5"]

[[case]]
id = "expansion.arithmetic-assignment"
class = "posix"
mode = "command"
script = "X=1; echo $((X += 2)); echo \"$X\""

[case.expect]
status = 0
stdout_contains = ["3"]

[[case]]
id = "expansion.arithmetic-simple-assignment-replaces-text"
class = "posix"
mode = "command"
script = 'X=abc; echo $((X = 7)); echo "$X"'

[case.expect]
status = 0
stdout_exact = "7\n7\n"
stderr_exact = ""

[[case]]
id = "expansion.arithmetic-chained-assignment-replaces-text"
class = "posix"
mode = "command"
script = 'A=abc; B=def; echo $((A = B = 7)); echo "$A/$B"'

[case.expect]
status = 0
stdout_exact = "7\n7/7\n"
stderr_exact = ""

[[case]]
id = "expansion.arithmetic-short-circuit-and"
class = "posix"
mode = "command"
script = "echo $((0 && 1 / 0))"

[case.expect]
status = 0
stdout_contains = ["0"]

[[case]]
id = "expansion.arithmetic-short-circuit-or"
class = "posix"
mode = "command"
script = "echo $((1 || 1 / 0))"

[case.expect]
status = 0
stdout_contains = ["1"]

[[case]]
id = "expansion.arithmetic-conditional"
class = "posix"
mode = "command"
script = "echo $((1 ? 10 : 20))"

[case.expect]
status = 0
stdout_contains = ["10"]

[[case]]
id = "expansion.invocation-default"
class = "posix"
mode = "command"
script = 'printf "%s:%s:%s\n" "$0" "$#" "${10}"'
[case.expect]
status = 0
stdout_contains = ["dogesh:0:"]

[[case]]
id = "expansion.invocation-zero-at"
class = "posix"
mode = "command"
script = 'printf "<%s>\n" before "$@" after'
[case.expect]
status = 0
stdout_contains = ["<before>", "<after>"]
stdout_not_contains = ["<>"]

[[case]]
id = "expansion.rendered-literal-argv"
class = "dogesh"
mode = "command"
script = '''"printf" '[%s]' "日本語" "a b" '' "a'b\"c" "*.rs" "a;b" "\$(echo injected)" "line1
line2" "C:\\path\\" "a\\'b"'''

[case.expect]
status = 0
stdout_exact = '''[日本語][a b][][a'b"c][*.rs][a;b][$(echo injected)][line1
line2][C:\path\][a\'b]'''
stderr_exact = ""

[[case]]
id = "expansion.glob-sorted"
class = "posix"
mode = "command"
script = "touch z.txt m.txt a.txt; echo *.txt"

[case.expect]
status = 0
stdout_exact = "a.txt m.txt z.txt\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-star-excludes-hidden-and-self"
class = "posix"
mode = "command"
script = "touch b visible.txt .hidden; mkdir -p sub; echo *"

[case.expect]
status = 0
stdout_exact = "b sub visible.txt\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-star-txt-excludes-hidden"
class = "posix"
mode = "command"
script = "touch visible.txt .hidden.txt; echo *.txt"

[case.expect]
status = 0
stdout_exact = "visible.txt\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-question-excludes-hidden"
class = "posix"
mode = "command"
script = "touch bb cc .a; echo ??"

[case.expect]
status = 0
stdout_exact = "bb cc\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-dotfile-explicit"
class = "posix"
mode = "command"
script = "touch .hidden.txt visible.txt; echo .*.txt"

[case.expect]
status = 0
stdout_exact = ".hidden.txt\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-bracket-does-not-match-leading-dot"
class = "posix"
mode = "command"
script = "touch .h; echo [.]h"

[case.expect]
status = 0
stdout_exact = "[.]h\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-dot-slash-prefix"
class = "posix"
mode = "command"
script = "touch a.txt m.txt .h.txt; echo ./*.txt"

[case.expect]
status = 0
stdout_exact = "./a.txt ./m.txt\n"
stderr_exact = ""

[[case]]
id = "expansion.glob-dot-slash-subdir"
class = "posix"
mode = "command"
script = "mkdir -p sub; touch sub/x.txt sub/.hx; echo ./sub/*.txt"

[case.expect]
status = 0
stdout_exact = "./sub/x.txt\n"
stderr_exact = ""
