version = 1

[[case]]
id = "interactive.foreground-chat-error-status"
class = "dogesh"
mode = "interactive"
script = "PRIOR=success\n!\necho CHAT_STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["CHAT_STATUS:1"]
stderr_contains = ["chat: message content required"]

# Interactive mode (`dogesh` reading lines from stdin): same semantics,
# prompt-wrapped output, so only containment assertions are used.

[[case]]
id = "interactive.echo-line"
class = "posix"
mode = "interactive"
script = "echo hello-interactive"

[case.expect]
status = 0
stdout_contains = ["hello-interactive"]

[[case]]
id = "interactive.pipeline-line"
class = "posix"
mode = "interactive"
script = "echo hello | {{TR}} a-z A-Z"

[case.expect]
status = 0
stdout_contains = ["HELLO"]

[[case]]
id = "interactive.status-across-lines"
class = "posix"
mode = "interactive"
script = "{{FALSE}}\necho GOT:$?"

[case.expect]
status = 0
stdout_contains = ["GOT:1"]

[[case]]
id = "interactive.assignment-persists-across-lines"
class = "posix"
mode = "interactive"
script = "FOO=interactive-bar\necho VAL:$FOO"

[case.expect]
status = 0
stdout_contains = ["VAL:interactive-bar"]

[[case]]
id = "interactive.ai-task-shortcut-needs-tty"
class = "dogesh"
mode = "command"
script = "!& literal 'broken $(echo unexpected) |! text &"

[case.expect]
status = 1
stderr_contains = ["!& requires an interactive input/output TTY"]

# The error line must be complete: an open quote would continue onto the
# following lines, as in `sh`.
[[case]]
id = "interactive.generic-eval-error-status-and-recovery"
class = "dogesh"
mode = "interactive"
script = "echo a && && echo should-not-run\necho ERROR_STATUS:$?\nRECOVERED=yes\necho RECOVERY_STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["ERROR_STATUS:1", "RECOVERY_STATUS:0"]
stdout_not_contains = ["should-not-run"]
stderr_contains = ["syntax error"]

# An ambiguous redirect is an ordinary command failure, not an eval error.
[[case]]
id = "interactive.ambiguous-redirect-is-command-failure"
class = "posix"
mode = "interactive"
script = "touch status-a status-b\necho hidden > status-* || echo RECOVERED:$?\necho STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["RECOVERED:1", "STATUS:0"]
stderr_contains = ["ambiguous redirect"]

[[case]]
id = "interactive.authorization-cancellation-keeps-status"
class = "dogesh"
mode = "interactive"
script = "rm -rf nonexistent-status-victim ; echo should-not-run\necho CANCEL_STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["CANCEL_STATUS:130"]
stdout_not_contains = ["should-not-run"]

# Piped input is read as a script: a line that is still incomplete (trailing
# `&&`/`|`, open quote) continues on the next line instead of being run alone.

[[case]]
id = "interactive.trailing-and-continues-on-next-line"
class = "posix"
mode = "interactive"
script = "{{FALSE}} &&\necho SHOULD_NOT_RUN\necho DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:1"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "interactive.trailing-pipe-continues-on-next-line"
class = "posix"
mode = "interactive"
script = "echo hello |\n{{TR}} a-z A-Z"

[case.expect]
status = 0
stdout_contains = ["HELLO"]

[[case]]
id = "interactive.open-double-quote-spans-lines"
class = "posix"
mode = "interactive"
script = "echo \"first\n  second\" END"

[case.expect]
status = 0
stdout_contains = ["first\n  second END"]
