version = 1

# `&&` / `||` gating on command status.

[[case]]
id = "list.and-runs-after-success"
class = "posix"
mode = "command"
script = "{{TRUE}} && echo RAN"

[case.expect]
status = 0
stdout_contains = ["RAN"]

[[case]]
id = "list.and-skips-after-failure"
class = "posix"
mode = "command"
script = "{{FALSE}} && echo SHOULD_NOT_RUN; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:1"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "list.or-runs-after-failure"
class = "posix"
mode = "command"
script = "{{FALSE}} || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]

[[case]]
id = "list.or-skips-after-success"
class = "posix"
mode = "command"
script = "{{TRUE}} || echo SHOULD_NOT_RUN; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:0"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "list.and-chain-stops-at-first-failure"
class = "posix"
mode = "command"
script = "{{TRUE}} && {{FALSE}} && echo SHOULD_NOT_RUN; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:1"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "list.or-chain-stops-at-first-success"
class = "posix"
mode = "command"
script = "{{FALSE}} || {{TRUE}} || echo SHOULD_NOT_RUN; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:0"]
stdout_not_contains = ["SHOULD_NOT_RUN"]

[[case]]
id = "list.bare-substitution-failure-gates-and"
class = "posix"
mode = "command"
script = "$({{FALSE}}) && echo SHOULD_NOT_RUN; echo DONE:$?"

[case.expect]
status = 0
stdout_not_contains = ["SHOULD_NOT_RUN"]
stdout_contains = ["DONE:1"]

[[case]]
id = "list.bare-substitution-failure-gates-or"
class = "posix"
mode = "command"
script = "$({{FALSE}}) || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]

# A `( list )` group's exit status gates `&&`/`||` and becomes `$?`.

[[case]]
id = "list.subshell-group-status-becomes-status"
class = "posix"
mode = "command"
script = "({{FALSE}}); echo S1:$?; (exit 3); echo S3:$?; ({{TRUE}}); echo S0:$?"

[case.expect]
status = 0
stdout_contains = ["S1:1", "S3:3", "S0:0"]

[[case]]
id = "list.subshell-group-status-gates-and-or"
class = "posix"
mode = "command"
script = "({{FALSE}}) && echo SHOULD_NOT_RUN; ({{FALSE}}) || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]
stdout_not_contains = ["SHOULD_NOT_RUN"]
