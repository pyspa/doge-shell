version = 1

[[case]]
id = "process-substitution.stopped-job-retains-read-helper"
class = "dogesh"
mode = "interactive"
timeout_ms = 8000
script = '''
mkfifo started gate
printf '%s\n' 'echo "$PPID" > helper.pid' 'echo ready > started' 'read release < gate' 'echo retained-input' > producer.sh
printf '%s\n' 'read ready < started' 'kill -STOP $$' 'cat "$1"' > outer.sh
printf '%s\n' 'read helper < helper.pid' 'kill -0 "$helper" || exit 1' 'echo retained-helper' > check.sh
{{SH}} outer.sh <({{SH}} producer.sh)
{{SH}} check.sh
'''

[case.expect]
status = 0
stdout_contains = ["retained-helper"]

[[case]]
id = "process-substitution.failed-launch-reaps-read-helper"
class = "dogesh"
mode = "command"
timeout_ms = 8000
script = '''
mkfifo started gate
printf '%s\n' 'echo "$PPID" > helper.pid' 'echo ready > started' 'read release < gate' > producer.sh
printf '%s\n' 'read ready < started' 'echo ready' > ready.sh
printf '%s\n' 'read helper < helper.pid' 'kill -0 "$helper" 2>/dev/null && exit 1' 'echo cleaned-helper' > check.sh
{{SH}} unused.sh <({{SH}} producer.sh) $({{SH}} ready.sh) < missing-input
{{SH}} check.sh
'''

[case.expect]
status = 0
stdout_contains = ["cleaned-helper"]
stderr_contains = ["missing-input"]

# Process substitution: producers behind /dev/fd handles.

[[case]]
id = "process-substitution.basic-producer"
class = "bash"
mode = "command"
script = "cat <(printf PROC-MARKER); echo SUB:$?"

[case.expect]
status = 0
stdout_contains = ["PROC-MARKER", "SUB:0"]

[[case]]
id = "process-substitution.multiple-producers"
class = "bash"
mode = "command"
script = "diff <(printf 'a\\n') <(printf 'a\\n'); echo DIFF:$?"

[case.expect]
status = 0
stdout_contains = ["DIFF:0"]

[[case]]
id = "process-substitution.slow-producer"
class = "bash"
mode = "command"
script = "printf 'sleep 1\\nprintf SLOW-MARKER\\n' > slow.sh; cat <({{SH}} slow.sh); echo SLOW:$?"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["SLOW-MARKER", "SLOW:0"]

[[case]]
id = "process-substitution.large-producer-128kib"
class = "bash"
mode = "command"
script = "cat <({{YES}} | {{HEAD}} -c 131072) | wc -c"
timeout_ms = 8000

[case.expect]
status = 0
stdout_contains = ["131072"]

[[case]]
id = "process-substitution.failing-producer-empty-output"
class = "bash"
mode = "command"
script = "cat <({{FALSE}}); echo SUB:$?"

[case.expect]
status = 0
stdout_contains = ["SUB:0"]
