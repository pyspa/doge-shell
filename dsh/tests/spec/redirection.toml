version = 1

# Redirections: ordering, append, input, and failure semantics.

[[case]]
id = "redirection.output-only-creates-empty-file"
class = "posix"
mode = "command"
script = "> out.txt; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:0"]
stderr_exact = ""

[[case.expect.files]]
path = "out.txt"
exists = true
content_exact = ""

[[case]]
id = "redirection.truncate-then-write"
class = "posix"
mode = "command"
script = "echo first > data.txt; echo second > data.txt; cat data.txt"

[case.expect]
status = 0
stdout_contains = ["second"]
stdout_not_contains = ["first"]

[[case]]
id = "redirection.append"
class = "posix"
mode = "command"
script = "echo one > data.txt; echo two >> data.txt; cat data.txt"

[case.expect]
status = 0
stdout_contains = ["one", "two"]

[[case]]
id = "redirection.input"
class = "posix"
mode = "command"
script = "echo payload > in.txt; cat < in.txt; echo IN:$?"

[case.expect]
status = 0
stdout_contains = ["payload", "IN:0"]

[[case]]
id = "redirection.stderr-to-stdout"
class = "posix"
mode = "command"
script = "echo hi 2>&1; echo MERGE:$?"

[case.expect]
status = 0
stdout_contains = ["hi", "MERGE:0"]
stderr_exact = ""

[[case]]
id = "redirection.both-to-file"
class = "posix"
mode = "command"
script = "echo hi > both.txt 2>&1; echo SEP; cat both.txt"

[case.expect]
status = 0
stdout_contains = ["SEP", "hi"]

[[case.expect.files]]
path = "both.txt"
exists = true
content_contains = ["hi"]

# `2>&1 > file`: stderr follows the *old* stdout (the harness), stdout goes
# to the file. `ls` produces both streams so the order is observable.
[[case]]
id = "redirection.stderr-order-before-truncate"
class = "posix"
mode = "command"
script = "ls /tmp /doge-shell-no-such-dir-xyz 2>&1 > ordered.txt; echo SEP"

[case.expect]
status = 0
stdout_contains = ["No such file", "SEP"]

[[case]]
id = "redirection.missing-file-marker-absent"
class = "posix"
mode = "command"
script = "echo hi > present.txt; echo DONE:$?"

[case.expect]
status = 0
stdout_contains = ["DONE:0"]

[[case.expect.files]]
path = "never-created-xyz.txt"
exists = false

# A failed redirect fails that command but the shell continues.
[[case]]
id = "redirection.failed-redirect-continues-shell"
class = "posix"
mode = "command"
script = "echo hi > /doge-shell-no-such-dir-xyz/f; echo ST:$?"

[case.expect]
status = 0
stdout_contains = ["ST:1"]

# Runnable output-redirect failure: the list continues with status 1.
[[case]]
id = "redirection.runnable-output-failure-continues-list"
class = "posix"
mode = "command"
script = "{{TRUE}} > /doge-shell-no-such-dir-xyz/out; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:1"]
stderr_contains = ["failed to create redirect file"]

# Runnable input-redirect failure behaves the same way.
[[case]]
id = "redirection.runnable-input-failure-continues-list"
class = "posix"
mode = "command"
script = "{{TRUE}} < /doge-shell-no-such-input-xyz; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:1"]
stderr_contains = ["failed to open input redirect file"]

# A failed redirect gates `&&`: the right side never runs.
[[case]]
id = "redirection.runnable-failure-gates-and"
class = "posix"
mode = "command"
script = "{{TRUE}} > /doge-shell-no-such-dir-xyz/out && echo SHOULD_NOT_RUN; echo STATUS:$?"

[case.expect]
status = 0
stdout_contains = ["STATUS:1"]
stdout_not_contains = ["SHOULD_NOT_RUN"]
stderr_contains = ["failed to create redirect file"]

# A failed redirect activates `||`.
[[case]]
id = "redirection.runnable-failure-activates-or"
class = "posix"
mode = "command"
script = "{{TRUE}} > /doge-shell-no-such-dir-xyz/out || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]
stderr_contains = ["failed to create redirect file"]

# A clearly regular builtin fails the same way (external-only fix guard).
[[case]]
id = "redirection.regular-builtin-failure-is-command-failure"
class = "posix"
mode = "command"
script = "help > /doge-shell-no-such-dir-xyz/out || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]
stderr_contains = ["failed to create redirect file"]

# A redirect failure inside `$( )` is a command failure, not a helper error.
[[case]]
id = "redirection.substitution-inner-failure-is-command-failure"
class = "posix"
mode = "command"
script = "$({{TRUE}} > /doge-shell-no-such-dir-xyz/out) || echo RECOVERED"

[case.expect]
status = 0
stdout_contains = ["RECOVERED"]
stderr_contains = ["failed to create redirect file"]

# A downstream redirect failure must not hang on the upstream producer.
[[case]]
id = "redirection.pipeline-downstream-failure-continues"
class = "posix"
mode = "command"
script = "{{YES}} | {{HEAD}} -n 1 > /doge-shell-no-such-dir-xyz/out; echo AFTER"
timeout_ms = 10000

[case.expect]
status = 0
stdout_contains = ["AFTER"]
stderr_contains = ["failed to create redirect file"]

# The failing command body itself never runs: no marker file appears.
[[case]]
id = "redirection.failing-command-body-never-runs"
class = "posix"
mode = "command"
script = "touch marker > /doge-shell-no-such-dir-xyz/out; echo DONE"

[case.expect]
status = 0
stdout_contains = ["DONE"]
stderr_contains = ["failed to create redirect file"]

[[case.expect.files]]
path = "marker"
exists = false

# A failed mixed duplication leaves stdio intact for the next command.
[[case]]
id = "redirection.failed-mixed-dup-does-not-leak-stdio"
class = "posix"
mode = "command"
script = "{{TRUE}} 2>&1 > /doge-shell-no-such-dir-xyz/out; echo NEXT"

[case.expect]
status = 0
stdout_contains = ["NEXT"]
stderr_contains = ["failed to create redirect file"]

# Repeated failures keep the shell usable: pipes and redirects still work.
[[case]]
id = "redirection.repeated-failures-keep-shell-usable"
class = "posix"
mode = "command"
script = "{{TRUE}} > /doge-shell-no-such-dir-xyz/o1; {{TRUE}} > /doge-shell-no-such-dir-xyz/o2; {{TRUE}} > /doge-shell-no-such-dir-xyz/o3; {{TRUE}} > /doge-shell-no-such-dir-xyz/o4; {{TRUE}} > /doge-shell-no-such-dir-xyz/o5; {{TRUE}} < /doge-shell-no-such-input-xyz; echo piped | {{TR}} a-z A-Z; echo PIPE:$?; echo data > ok.txt; cat ok.txt"

[case.expect]
status = 0
stdout_contains = ["PIPED", "PIPE:0", "data"]
stderr_contains = ["failed to create redirect file"]
