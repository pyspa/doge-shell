version = 1

# Signal deaths map to 128 + signal number.

[[case]]
id = "signal.sigint-maps-to-130"
class = "posix"
mode = "command"
script = "printf 'kill -INT $$\\n' > sigint.sh; {{SH}} sigint.sh; echo GOT:$?"

[case.expect]
status = 0
stdout_contains = ["GOT:130"]

