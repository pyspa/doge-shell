version = 1

[[case]]
id = "simple-command.splice-before-tokenization"
class = "posix"
mode = "command"
script = '''
VA\
LUE=ok
ec\
ho "$VA\
LUE" &\
& printf '<%s>\n' café\
ine
'''
[case.expect]
status = 0
stdout_exact = "ok\n<caféine>\n"
stderr_exact = ""

[[case]]
id = "simple-command.splice-quoted-and-comment-boundaries"
class = "posix"
mode = "command"
script = '''
printf '<%s>\n' 'a\
b' "c\
d" e\\
echo \\
echo \
# ignored \
echo next
'''
[case.expect]
status = 0
stdout_exact = "<a\\\nb>\n<cd>\n<e\\>\n\\\n\nnext\n"
stderr_exact = ""

[[case]]
id = "simple-command.splice-in-nested-command"
class = "posix"
mode = "command"
script = '''
printf '<%s>\n' "$\
(echo 'a\
b' # ignored \
)" "$((1 + 2\
0))" "${UNSET:-fa\
llback}"
'''
[case.expect]
status = 0
stdout_exact = "<a\\\nb>\n<21>\n<fallback>\n"
stderr_exact = ""

[[case]]
id = "simple-command.piped-spliced-operator"
class = "posix"
mode = "interactive"
script = '''
echo one &\
&
echo tw\
o
echo \
# ignored \
echo three
'''
[case.expect]
status = 0
stdout_exact = "one\ntwo\n\nthree\n"
stderr_exact = ""

# Simple commands: status propagation is the shell's most basic contract.
# `dogesh -c` exits with the last command's status.

[[case]]
id = "simple-command.true-status"
class = "posix"
mode = "command"
script = "{{TRUE}}"

[case.expect]
status = 0
stdout_exact = ""
stderr_exact = ""

[[case]]
id = "simple-command.false-status"
class = "posix"
mode = "command"
script = "{{FALSE}}"

[case.expect]
status = 1
stdout_exact = ""
stderr_exact = ""

[[case]]
id = "simple-command.not-found-status"
class = "posix"
mode = "command"
script = "doge-shell-no-such-command-xyz"

[case.expect]
status = 127
stderr_contains = ["command not found"]

[[case]]
id = "simple-command.exit-seven-propagates"
class = "posix"
mode = "command"
script = "printf 'exit 7\\n' > exit7.sh; {{SH}} exit7.sh; echo GOT:$?"

[case.expect]
status = 0
stdout_contains = ["GOT:7"]

[[case]]
id = "simple-command.sequence-keeps-last-status"
class = "posix"
mode = "command"
script = "{{TRUE}}; {{FALSE}}; echo GOT:$?"

[case.expect]
status = 0
stdout_contains = ["GOT:1"]

[[case]]
id = "simple-command.echo-args"
class = "posix"
mode = "command"
script = "echo hello world"

[case.expect]
status = 0
stdout_contains = ["hello world"]

[[case]]
id = "simple-command.external-stdout-byte-exact"
class = "posix"
mode = "command"
script = "printf '%s' 'printf abc' > emit.sh; {{SH}} emit.sh"

[case.expect]
status = 0
stdout_exact = "abc"
stderr_exact = ""

[[case]]
id = "simple-command.external-streams-separate"
class = "posix"
mode = "command"
script = "printf '%s' 'printf out; printf err >&2' > emit.sh; {{SH}} emit.sh"

[case.expect]
status = 0
stdout_exact = "out"
stderr_exact = "err"

[[case]]
id = "simple-command.parent-builtin-capture-keeps-state"
class = "dogesh"
mode = "command"
script = "alias capture_probe=parent; alias capture_probe; export CAPTURE_PROBE=kept; echo $CAPTURE_PROBE"

[case.expect]
status = 0
stdout_exact = "capture_probe='parent'\nkept\n"
stderr_exact = ""

# `exit N` terminates `-c` execution with status N.
[[case]]
id = "simple-command.exit-status-argument"
class = "posix"
mode = "command"
script = "exit 3"

[case.expect]
status = 3

[[case]]
id = "simple-command.exit-stops-script"
class = "posix"
mode = "command"
script = "exit 3; echo AFTER"

[case.expect]
status = 3
stdout_not_contains = ["AFTER"]

[[case]]
id = "simple-command.exit-without-argument-uses-last-status"
class = "posix"
mode = "command"
script = "{{FALSE}}; exit"

[case.expect]
status = 1

[[case]]
id = "simple-command.exit-in-substitution-keeps-parent"
class = "posix"
mode = "command"
script = "X=$(exit 4; echo SUB); echo \"[$X]\"; echo DONE"

[case.expect]
status = 0
stdout_exact = "[]\nDONE\n"

[[case]]
id = "simple-command.exit-stops-interactive-input"
class = "posix"
mode = "interactive"
script = "echo BEFORE\nexit 4\necho AFTER"

[case.expect]
status = 4
stdout_contains = ["BEFORE"]
stdout_not_contains = ["AFTER"]

# A bare `exit` on piped input is the builtin too, so it reports `$?`.
[[case]]
id = "simple-command.bare-exit-on-interactive-input-uses-last-status"
class = "posix"
mode = "interactive"
script = "{{FALSE}}\nexit\necho AFTER"

[case.expect]
status = 1
stdout_not_contains = ["AFTER"]

# End of piped input exits with the last command's status, like `sh < file`.
[[case]]
id = "simple-command.end-of-interactive-input-uses-last-status"
class = "posix"
mode = "interactive"
script = "echo BEFORE\n{{FALSE}}"

[case.expect]
status = 1
stdout_contains = ["BEFORE"]

[[case]]
id = "simple-command.notebook-confirmed-block-status"
class = "dogesh"
mode = "command"
script = "printf '```sh\\nexit 23\\n```\\n' > book.md; echo y > answers; notebook-play book.md < answers"

[case.expect]
status = 23
stderr_contains = ["block 1", "23"]

[[case]]
id = "simple-command.saved-command-preserves-literal-words"
class = "dogesh"
mode = "command"
script = """bookmark add words printf '<%s>\\n' 'a  b' '' "it's"; bookmark run words; snippet add words printf '[%s]\\n' 'x  y' ''; snippet run words"""

[case.expect]
status = 0
stdout_contains = ["<a  b>\n<>\n<it's>\n", "[x  y]\n[]\n"]

[[case]]
id = "simple-command.continued-foreground-chat-marker"
class = "dogesh"
mode = "command"
script = "\\\n!"
[case.expect]
status = 1
stderr_contains = ["message content required"]

[[case]]
id = "simple-command.continued-task-marker-preserves-next-line"
class = "dogesh"
mode = "interactive"
script = "\\\n!& fix what's broken\necho NEXT"
[case.expect]
status = 0
stdout_exact = "NEXT\n"
stderr_contains = ["!& requires an interactive input/output TTY"]
