version = 1

# doge-shell Smart Pipe: `|` at line head continues the previous pipeline
# and downstream stages must observe transformed data (not duplicated text).

[[case]]
id = "smart-pipe.real-downstream-transform"
class = "dogesh"
mode = "interactive"
script = """
echo abcdef
| {{TR}} a-z A-Z
"""

[case.expect]
status = 0
stdout_contains = ["ABCDEF"]

[[case]]
id = "smart-pipe.multi-stage-transform"
class = "dogesh"
mode = "interactive"
script = """
echo hello
| {{TR}} a-z A-Z | {{TR}} H h
"""

[case.expect]
status = 0
stdout_contains = ["hELLO"]

[[case]]
id = "smart-pipe.empty-history"
class = "dogesh"
mode = "interactive"
script = """
| {{TR}} a-z A-Z
echo SMART_STATUS:$?
"""

[case.expect]
status = 0
stdout_contains = ["SMART_STATUS:0"]

[[case]]
id = "smart-pipe.no-final-newline"
class = "dogesh"
mode = "interactive"
script = """
printf abc
| {{TR}} a-z A-Z
"""

[case.expect]
status = 0
stdout_contains = ["ABC"]

[[case]]
id = "smart-pipe.large-source-no-deadlock"
class = "dogesh"
mode = "interactive"
script = """
{{YES}} | {{HEAD}} -c 10000
| {{HEAD}} -c 1 > replay.txt
"""
timeout_ms = 15000

[case.expect]
status = 0
files = [{ path = "replay.txt", content_exact = "y" }]
